<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>Sales Manager · Flipkart</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
        }

        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .stat-card {
            transition: transform 0.15s;
            border: 1px solid #e2e8f0;
            background: #fff;
        }
        .stat-card:active { transform: scale(0.98); }

        .badge-status {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            letter-spacing: 0.3px;
        }
        .badge-status.available { background: #d1fae5; color: #065f46; }
        .badge-status.sold { background: #dbeafe; color: #1e40af; }

        .btn-action {
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 44px;
        }
        .btn-action:active { transform: scale(0.96); }
        .btn-action i { width: 18px; height: 18px; }

        .btn-action.sell { background: #dbeafe; color: #1e40af; }
        .btn-action.view { background: #eef2ff; color: #4f46e5; }
        .btn-action.refresh { background: #f1f5f9; color: #475569; }
        .btn-action.primary { background: #4f46e5; color: #fff; }
        .btn-action.success { background: #059669; color: #fff; }

        .input-field {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 14px;
            width: 100%;
            font-size: 16px; /* prevents iOS zoom */
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            background: #fff;
            min-height: 48px;
        }
        .input-field:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .input-field:disabled, .input-field[readonly] {
            background: #f1f5f9;
            cursor: not-allowed;
        }

        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-overlay {
            backdrop-filter: blur(6px);
            background: rgba(15, 23, 42, 0.5);
        }

        .spinner-sm {
            border: 2px solid #e2e8f0;
            border-top: 2px solid #4f46e5;
            border-radius: 50%;
            width: 20px; height: 20px;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }
        .empty-state i {
            width: 44px; height: 44px;
            margin-bottom: 10px;
            color: #cbd5e1;
        }

        .toast-fixed {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast-fixed.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .toast-fixed.success { background: #065f46; }
        .toast-fixed.error { background: #991b1b; }
        .toast-fixed.info { background: #1e40af; }

        .pulse-ring {
            animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        /* Inventory card (mobile) */
        .inventory-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px;
            transition: transform 0.15s;
        }
        .inventory-card:active { transform: scale(0.99); }

        /* Sell Modal */
        .sell-modal .field-group { margin-bottom: 14px; }
        .sell-modal label {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            display: block;
            margin-bottom: 6px;
        }
        .sell-modal input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
            background: #fff;
            min-height: 48px;
        }
        .sell-modal input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .sell-modal input:disabled {
            background: #f1f5f9;
            cursor: not-allowed;
        }

        /* Detail Modal */
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .detail-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
        }
        .detail-item.full { grid-column: 1 / -1; }
        .detail-item .label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .detail-item .value {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            word-break: break-all;
            margin-top: 2px;
        }

        /* Mobile-first modal: bottom sheet on mobile, centered on desktop */
        .mobile-modal {
            background: #fff;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar { width: 0; height: 0; }
        * { scrollbar-width: none; }

        /* Desktop: centered modal */
        @media (min-width: 768px) {
            .mobile-modal {
                border-radius: 24px;
                max-width: 480px;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>

    <!-- Toast -->
    <div id="toast" class="toast-fixed"></div>

    <!-- ====== MAIN APP ====== -->
    <div class="max-w-6xl mx-auto px-3 sm:px-6 py-4 sm:py-8">

        <!-- Header -->
        <header class="glass rounded-2xl px-4 sm:px-6 py-4 shadow-sm border border-gray-100 mb-4 sm:mb-6 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center shadow-lg flex-shrink-0">
                    <i data-lucide="badge-dollar-sign" class="w-5 h-5 sm:w-7 sm:h-7 text-white"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="text-base sm:text-2xl font-bold text-gray-800 truncate">Sales Manager</h1>
                    <p class="text-xs sm:text-sm text-gray-500 truncate">Sell phones from inventory</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
                <span id="connectionStatus" class="hidden sm:flex items-center gap-1.5 px-3 py-1 bg-green-50 rounded-full text-xs font-medium text-green-700">
                    <div class="w-2 h-2 bg-green-500 rounded-full pulse-ring" id="statusDot"></div>
                    <span id="statusText">Online</span>
                </span>
                <button onclick="refreshInventory()" class="btn-action refresh" style="padding: 8px;">
                    <i data-lucide="refresh-cw"></i>
                </button>
            </div>
        </header>

        <!-- ====== STATS ====== -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="stat-card rounded-2xl p-3 sm:p-4 shadow-sm">
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="w-9 h-9 sm:w-10 sm:h-10 bg-blue-100 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i data-lucide="package-check" class="w-4 h-4 sm:w-5 sm:h-5 text-blue-600"></i>
                    </div>
                    <div class="min-w-0">
                        <p class="text-xl sm:text-2xl font-bold text-gray-800" id="statInventory">0</p>
                        <p class="text-[10px] sm:text-xs text-gray-500 font-medium truncate">In Stock</p>
                    </div>
                </div>
            </div>
            <div class="stat-card rounded-2xl p-3 sm:p-4 shadow-sm">
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="w-9 h-9 sm:w-10 sm:h-10 bg-purple-100 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i data-lucide="trending-up" class="w-4 h-4 sm:w-5 sm:h-5 text-purple-600"></i>
                    </div>
                    <div class="min-w-0">
                        <p class="text-xl sm:text-2xl font-bold text-gray-800" id="statSold">0</p>
                        <p class="text-[10px] sm:text-xs text-gray-500 font-medium truncate">Sold</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ====== SEARCH BAR ====== -->
        <div class="glass rounded-2xl p-3 sm:p-4 shadow-sm border border-gray-100 mb-3 sm:mb-4">
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="inventorySearch" placeholder="Search Order ID or Model..." class="input-field" onkeyup="if(event.key==='Enter') applySearch()" />
                <div class="flex gap-2">
                    <button onclick="applySearch()" class="btn-action sell flex-1 sm:flex-none">
                        <i data-lucide="search"></i> <span class="sm:hidden">Search</span>
                    </button>
                    <button onclick="clearSearch()" class="btn-action refresh flex-1 sm:flex-none">
                        <i data-lucide="x"></i>
                    </button>
                </div>
            </div>
            <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100">
                <span class="text-xs sm:text-sm text-gray-500 font-medium" id="inventoryCount">0 phones</span>
                <span class="text-xs text-gray-400" id="lastUpdated"></span>
            </div>
        </div>

        <!-- ====== INVENTORY LIST (Cards on mobile, Table on desktop) ====== -->
        
        <!-- Mobile: Card view -->
        <div id="inventoryCards" class="space-y-3 sm:hidden">
            <div class="empty-state">
                <i data-lucide="inbox"></i>
                <p class="text-sm font-medium">No inventory</p>
                <p class="text-xs text-gray-400 mt-1">Phones picked up will appear here</p>
            </div>
        </div>

        <!-- Desktop: Table view -->
        <div class="hidden sm:block glass rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-100">
                            <th class="text-left py-3 px-4 text-xs font-bold text-gray-500 uppercase">#</th>
                            <th class="text-left py-3 px-4 text-xs font-bold text-gray-500 uppercase">Order ID</th>
                            <th class="text-left py-3 px-4 text-xs font-bold text-gray-500 uppercase">Model</th>
                            <th class="text-left py-3 px-4 text-xs font-bold text-gray-500 uppercase">Customer</th>
                            <th class="text-left py-3 px-4 text-xs font-bold text-gray-500 uppercase">Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <tr><td colspan="5"><div class="empty-state"><i data-lucide="inbox"></i><p class="text-sm font-medium">No inventory</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ====== SELL MODAL (Bottom sheet on mobile) ====== -->
    <div id="sellModal" class="fixed inset-0 z-50 modal-overlay flex items-end sm:items-center justify-center" style="display:none;">
        <div class="mobile-modal slide-up sell-modal">
            <!-- Drag handle (mobile) -->
            <div class="sm:hidden flex justify-center pt-2 pb-1">
                <div class="w-10 h-1 bg-gray-300 rounded-full"></div>
            </div>
            <div class="sticky top-0 bg-white z-10 px-5 pt-2 sm:pt-5 pb-3 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i data-lucide="badge-dollar-sign" class="w-5 h-5 text-green-600"></i>
                    Sell Phone
                </h3>
                <button onclick="closeSellModal()" class="p-2 hover:bg-gray-100 rounded-full transition">
                    <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                </button>
            </div>
            <div class="p-5 space-y-3">
                <div class="field-group">
                    <label>Order ID</label>
                    <input type="text" id="sellOrderId" readonly />
                </div>
                <div class="field-group">
                    <label>Phone Model</label>
                    <input type="text" id="sellModel" readonly />
                </div>
                <div class="field-group">
                    <label>Customer Name</label>
                    <input type="text" id="sellCustomer" readonly />
                </div>
                <div class="field-group">
                    <label>Sale Price (₹) <span class="text-red-500">*</span></label>
                    <input type="number" id="sellSalePrice" placeholder="Enter sale price" step="1" min="0" inputmode="numeric" />
                </div>
                <div class="field-group">
                    <label>Buyer Name <span class="text-red-500">*</span></label>
                    <input type="text" id="sellBuyerName" placeholder="Enter buyer name" />
                </div>
                <div class="field-group">
                    <label>Buyer Contact <span class="text-gray-400">(optional)</span></label>
                    <input type="tel" id="sellBuyerContact" placeholder="Phone number" inputmode="tel" />
                </div>
                <div class="field-group">
                    <label>Sale Date</label>
                    <input type="date" id="sellSaleDate" />
                </div>
            </div>
            <div class="sticky bottom-0 bg-white px-5 py-4 border-t border-gray-100 flex gap-2">
                <button onclick="closeSellModal()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 font-semibold hover:bg-gray-200 transition">Cancel</button>
                <button onclick="confirmSell()" class="flex-1 py-3 rounded-xl bg-green-600 text-white font-semibold hover:bg-green-700 transition flex items-center justify-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4"></i> Confirm
                </button>
            </div>
        </div>
    </div>

    <!-- ====== DETAIL MODAL ====== -->
    <div id="detailModal" class="fixed inset-0 z-50 modal-overlay flex items-end sm:items-center justify-center" style="display:none;">
        <div class="mobile-modal slide-up">
            <div class="sm:hidden flex justify-center pt-2 pb-1">
                <div class="w-10 h-1 bg-gray-300 rounded-full"></div>
            </div>
            <div class="sticky top-0 bg-white z-10 px-5 pt-2 sm:pt-5 pb-3 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-bold text-lg flex items-center gap-2">
                    <i data-lucide="file-text" class="w-5 h-5 text-indigo-600"></i>
                    Order Details
                </h3>
                <button onclick="closeDetailModal()" class="p-2 hover:bg-gray-100 rounded-full transition">
                    <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                </button>
            </div>
            <div class="p-5" id="detailContent">
                <div class="text-center py-8 text-gray-400">
                    <span class="spinner-sm"></span>
                    <p class="text-sm mt-2">Loading...</p>
                </div>
            </div>
            <div class="sticky bottom-0 bg-white px-5 py-4 border-t border-gray-100">
                <button onclick="closeDetailModal()" class="w-full py-3 rounded-xl bg-gray-100 text-gray-700 font-semibold hover:bg-gray-200 transition">Close</button>
            </div>
        </div>
    </div>

    <!-- External JS -->
    <script src="script.js"></script>

</body>
</html>
